<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Record Operations - PulseBadge Mini</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div id="app-root" class="app-shell" data-setfarm-root="record-operations" data-testid="setfarm-app-root">
      <nav class="app-nav" aria-label="Primary">
        <div class="app-brand">
          <span class="app-brand-mark">●</span>
          <span class="app-brand-name">PulseBadge Mini</span>
        </div>
        <div class="app-nav-links">
          <a class="app-nav-link is-active" href="record-operations-pulsebadge-mini.html">Operations</a>
          <a class="app-nav-link" href="record-editor-pulsebadge-mini.html">Editor</a>
          <a class="app-nav-link" href="index.html">Insights</a>
        </div>
        <div class="app-nav-meta">
          <span class="storage-status" data-testid="storage-status">ready</span>
          <button type="button" class="app-button app-button--small" onclick="console.log('menu')" data-action-id="ACT_MENU" aria-label="Menu">menu</button>
          <button type="button" class="app-button app-button--small" onclick="console.log('notifications')" data-action-id="ACT_NOTIFICATIONS" aria-label="Notifications">notifications</button>
          <button type="button" class="app-button app-button--small" onclick="console.log('settings')" data-action-id="ACT_SETTINGS" aria-label="Settings">settings</button>
        </div>
      </nav>
      <main class="app-main" data-testid="app-main">
        <header class="screen-header">
          <h2>Record Operations</h2>
          <p class="screen-summary">Monitor and manage service records.</p>
        </header>
        <div class="screen-controls">
          <input class="app-input" type="text" placeholder="Search records..." data-action-id="ACT_SEARCH_RECORDS" data-testid="search-records" aria-label="Search records" />
          <button type="button" class="app-button" onclick="void(0)" data-action-id="ACT_FILTER" aria-label="Filter records">Filter</button>
          <button type="button" class="app-button app-button--primary" onclick="void(0)" data-action-id="ACT_CREATE_RECORD" data-testid="create-record">Create Record</button>
        </div>
        <div class="record-list" data-testid="record-list"></div>
        <div class="screen-controls" style="margin-top: 20px;">
          <button type="button" class="app-button" onclick="void(0)" data-action-id="ACT_RETRY_LOAD" aria-label="Retry loading data">Restart</button>
          <button type="button" class="app-button app-button--secondary" onclick="console.log('view logs')" data-action-id="ACT_VIEW_LOGS" aria-label="View logs">View Logs</button>
        </div>
      </main>
    </div>
    <script src="assets/js/pulsebadge-mini.storage.js"></script>
    <script src="assets/js/pulsebadge-mini.state.js"></script>
    <script>
      (function () {
        'use strict';
        function formatStatus(status) {
          return typeof status === 'string' ? status : 'unknown';
        }
        function renderList(records) {
          const list = document.querySelector('.record-list');
          if (!list) return;
          list.innerHTML = '';
          if (!records || records.length === 0) {
            list.appendChild(document.createElement('p')).className = 'empty-state';
            list.lastChild.textContent = 'No records found.';
            return;
          }
          records.forEach(function (record) {
            const card = document.createElement('article');
            card.className = 'record-card record-card--' + formatStatus(record.status);
            card.setAttribute('data-record-id', record.id);
            const name = document.createElement('h3');
            name.className = 'record-name';
            name.textContent = record.name;
            card.appendChild(name);
            const host = document.createElement('p');
            host.className = 'record-host';
            host.textContent = record.host;
            card.appendChild(host);
            const status = document.createElement('span');
            status.className = 'record-status record-status--' + formatStatus(record.status);
            status.textContent = record.status;
            card.appendChild(status);
            const inspect = document.createElement('button');
            inspect.type = 'button';
            inspect.className = 'app-button app-button--secondary';
            inspect.setAttribute('data-action-id', 'ACT_SELECT_RECORD');
            inspect.setAttribute('aria-label', 'Inspect ' + record.name);
            inspect.textContent = 'Inspect';
            inspect.setAttribute('onclick', "/* inspect handled by act_select_record */");
            card.appendChild(inspect);
            list.appendChild(card);
          });
        }
        function bootstrapPage() {
          const fixtures = window.__PULSEBADGE_FIXTURES__ || { records: [], preferences: { defaultScreen: 'operations' } };
          const storage = PulseBadgeStorage.createStorageAdapter();
          const store = PulseBadgeState.createStateStore({ storage: storage, fixtures: fixtures });
          store.bootstrap();
          window.__PB_STORE__ = store;
          renderList(store.getState().records);
          const statusEl = document.querySelector('[data-testid="storage-status"]');
          if (statusEl) {
            statusEl.textContent = storage.getStatus();
            statusEl.className = 'storage-status storage-status--' + storage.getStatus();
          }
        }
        if (window.__PULSEBADGE_FIXTURES__) {
          bootstrapPage();
        } else {
          fetch('assets/data/pulsebadge-mini.json')
            .then(function (response) { return response.json(); })
            .then(function (fixtures) {
              window.__PULSEBADGE_FIXTURES__ = fixtures;
              bootstrapPage();
            })
            .catch(function () {
              window.__PULSEBADGE_FIXTURES__ = { records: [], preferences: { defaultScreen: 'operations' } };
              bootstrapPage();
            });
        }
      })();
    </script>
    <script src="assets/js/us-002/act_search_records.js"></script>
    <script src="assets/js/us-002/act_create_record.js"></script>
    <script src="assets/js/us-002/act_select_record.js"></script>
    <script src="assets/js/us-002/act_retry_load.js"></script>
  </body>
</html>
