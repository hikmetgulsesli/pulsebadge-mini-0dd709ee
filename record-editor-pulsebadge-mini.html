<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Record Editor - PulseBadge Mini</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <main id="app-root" data-setfarm-root="editor" data-testid="setfarm-app-root" class="app-shell">
      <nav class="app-nav" aria-label="Primary">
        <div class="app-brand">
          <span class="app-brand-mark">●</span>
          <span class="app-brand-name">PulseBadge Mini</span>
        </div>
        <div class="app-nav-links">
          <button class="app-nav-link" type="button" data-action-id="ACT_OPERATIONS" data-screen="operations" onclick="void(0)">Operations</button>
          <button class="app-nav-link is-active" type="button" data-action-id="ACT_NAV_EDITOR" data-screen="editor" onclick="void(0)">Editor</button>
          <button class="app-nav-link" type="button" data-action-id="ACT_INSIGHTS" data-screen="insights" onclick="void(0)">Insights</button>
        </div>
        <div class="app-nav-meta">
          <span class="storage-status storage-status--ready" data-testid="storage-status">ready</span>
        </div>
      </nav>

      <main class="app-main" data-testid="app-main" data-screen="editor">
        <header class="screen-header">
          <h2>Record Editor</h2>
          <p class="screen-summary">Edit the selected service record.</p>
        </header>

        <form class="record-form" data-testid="record-form">
          <div class="form-group">
            <label for="record-name">Service name</label>
            <input class="app-input" id="record-name" type="text" placeholder="e.g., Auth API" data-testid="record-name-input" />
          </div>
          <div class="form-group">
            <label for="record-host">Host / Identifier</label>
            <input class="app-input" id="record-host" type="text" placeholder="srv-auth-01" data-testid="record-host-input" />
          </div>
          <div class="form-group">
            <label for="record-status">Status</label>
            <select class="app-input app-select" id="record-status" data-testid="record-status-select">
              <option value="healthy">healthy</option>
              <option value="warning">warning</option>
              <option value="critical">critical</option>
            </select>
          </div>
          <div class="form-actions">
            <button class="app-button" type="button" data-action-id="ACT_CANCEL_EDIT" onclick="void(0)">Cancel</button>
            <button class="app-button app-button--primary" type="submit" data-action-id="ACT_SAVE_RECORD">Save Record</button>
          </div>
        </form>
      </main>
    </main>

    <script src="assets/js/pulsebadge-mini.storage.js" defer></script>
    <script src="assets/js/pulsebadge-mini.state.js" defer></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        fetch('assets/data/pulsebadge-mini.json')
          .then(function (response) { return response.json(); })
          .then(function (fixtures) {
            window.__PULSEBADGE_FIXTURES__ = fixtures;
            const scripts = [
              'assets/js/us-002/act_save_record.js',
              'assets/js/us-002/act_cancel_edit.js'
            ];
            scripts.forEach(function (src) {
              const s = document.createElement('script');
              s.src = src;
              s.defer = true;
              document.body.appendChild(s);
            });
          })
          .catch(function () {
            window.__PULSEBADGE_FIXTURES__ = { records: [], preferences: { defaultScreen: 'operations' } };
            const scripts = [
              'assets/js/us-002/act_save_record.js',
              'assets/js/us-002/act_cancel_edit.js'
            ];
            scripts.forEach(function (src) {
              const s = document.createElement('script');
              s.src = src;
              s.defer = true;
              document.body.appendChild(s);
            });
          });
      });
    </script>
  </body>
</html>
