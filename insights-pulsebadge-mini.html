<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insights - PulseBadge Mini</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      .screen-header h1 {
        margin: 0 0 6px;
        font-size: 24px;
        font-weight: 700;
      }
      /* High-contrast accessible status badges */
      .storage-status--ready,
      .storage-status--healthy,
      .record-status--healthy {
        background: #14532d !important;
        color: #86efac !important;
      }
      .storage-status--warning,
      .record-status--warning {
        background: #713f12 !important;
        color: #fef08a !important;
      }
      .storage-status--critical,
      .record-status--critical {
        background: #881337 !important;
        color: #fda4af !important;
      }
      .storage-status--corrupted,
      .storage-status--error {
        background: #450a0a !important;
        color: #fecaca !important;
      }
      .storage-status--loading {
        background: #422006 !important;
        color: #fde047 !important;
      }
    </style>
  </head>
  <body>
    <div id="app-root" class="app-shell" data-setfarm-root="insights" data-testid="setfarm-app-root">
      <nav class="app-nav" aria-label="Primary">
        <div class="app-brand">
          <span class="app-brand-mark">●</span>
          <span class="app-brand-name">PulseBadge Mini</span>
        </div>
        <div class="app-nav-links">
          <a class="app-nav-link" href="record-operations-pulsebadge-mini.html" data-action-id="ACT_OPERATIONS">Operations</a>
          <a class="app-nav-link" href="record-editor-pulsebadge-mini.html" data-action-id="ACT_EDITOR">Editor</a>
          <a class="app-nav-link is-active" href="insights-pulsebadge-mini.html" data-action-id="ACT_INSIGHTS" aria-current="page">Insights</a>
        </div>
        <div class="app-nav-meta">
          <span class="storage-status" data-testid="storage-status">ready</span>
          <button type="button" class="app-button app-button--small" onclick="console.log('menu')" data-action-id="ACT_MENU" aria-label="Menu">menu</button>
          <button type="button" class="app-button app-button--small" onclick="console.log('notifications')" data-action-id="ACT_NAVIGATE" aria-label="Notifications">notifications</button>
          <button type="button" class="app-button app-button--small" onclick="console.log('settings')" data-action-id="ACT_SETTINGS" aria-label="Settings">settings</button>
        </div>
      </nav>
      <main class="app-main" data-testid="app-main">
        <header class="screen-header">
          <h1>Insights</h1>
          <p class="screen-summary">High-level health overview.</p>
        </header>
        <div class="insights-grid" data-testid="insights-grid"></div>
        <div class="screen-controls">
          <button type="button" class="app-button" onclick="void(0)" data-action-id="ACT_FILTER_INSIGHTS" aria-label="Filter insights">Filter Insights</button>
          <button type="button" class="app-button app-button--secondary" onclick="void(0)" data-action-id="ACT_EXPORT_SUMMARY" aria-label="Export JSON snapshot">JSON Snapshot</button>
          <button type="button" class="app-button app-button--secondary" onclick="console.log('view logs')" data-action-id="ACT_VIEW_LOGS" aria-label="View logs">View Logs</button>
        </div>
        <div class="screen-controls" style="margin-top: 20px;">
          <button type="button" class="app-button" onclick="void(0)" data-action-id="ACT_VIEW_ALL" aria-label="View all monitors">VIEW ALL</button>
          <button type="button" class="app-button app-button--primary" data-action-id="ACT_CREATE" aria-label="Add monitor">ADD MONITOR</button>
        </div>
        <div class="snapshot-panel is-hidden" data-testid="snapshot-panel" style="margin-top: 20px;"></div>
      </main>
    </div>
    <script src="assets/js/pulsebadge-mini.storage.js"></script>
    <script src="assets/js/pulsebadge-mini.state.js"></script>
    <script>
      (function () {
        'use strict';
        function renderInsightsGrid(records, counts) {
          const grid = document.querySelector('[data-testid="insights-grid"]');
          if (!grid) return;
          grid.innerHTML = '';
          const safeCounts = counts || { total: 0, healthy: 0, warning: 0, critical: 0 };
          const metrics = [
            { key: 'total', label: 'Total', value: safeCounts.total || 0 },
            { key: 'healthy', label: 'Healthy', value: safeCounts.healthy || 0 },
            { key: 'warning', label: 'Warning', value: safeCounts.warning || 0 },
            { key: 'critical', label: 'Critical', value: safeCounts.critical || 0 }
          ];
          metrics.forEach(function (metric) {
            const card = document.createElement('div');
            card.className = 'insight-card insight-card--' + metric.key;
            card.setAttribute('data-metric', metric.key);
            const value = document.createElement('span');
            value.className = 'insight-value';
            value.textContent = metric.value;
            card.appendChild(value);
            const label = document.createElement('span');
            label.className = 'insight-label';
            label.textContent = metric.label;
            card.appendChild(label);
            grid.appendChild(card);
          });
        }
        function renderSnapshot(state) {
          const panel = document.querySelector('[data-testid="snapshot-panel"]');
          if (!panel) return;
          const safeState = state || {};
          if (safeState.activePanel === 'snapshot') {
            panel.textContent = JSON.stringify({ records: safeState.records, counts: safeState.counts }, null, 2);
            panel.classList.remove('is-hidden');
          } else {
            panel.classList.add('is-hidden');
            panel.textContent = '';
          }
        }
        function bootstrapPage() {
          const fixtures = window.__PULSEBADGE_FIXTURES__ || { records: [], preferences: { defaultScreen: 'operations' } };
          const storage = PulseBadgeStorage.createStorageAdapter();
          const store = PulseBadgeState.createStateStore({ storage: storage, fixtures: fixtures });
          store.bootstrap();
          store.setActiveScreen('insights');
          window.__PB_STORE__ = store;
          const state = store.getState();
          renderInsightsGrid(state.records, state.counts);
          renderSnapshot(state);
          store.subscribe(function (nextState) {
            renderInsightsGrid(nextState.records, nextState.counts);
            renderSnapshot(nextState);
          });
          const statusEl = document.querySelector('[data-testid="storage-status"]');
          if (statusEl) {
            statusEl.textContent = storage.getStatus();
            statusEl.className = 'storage-status storage-status--' + storage.getStatus();
          }
          document.querySelectorAll('[data-action-id="ACT_CREATE"]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              const store = window.__PB_STORE__;
              if (!store || typeof store.addRecord !== 'function') return;
              const nextId = 'mon-' + Date.now();
              const added = store.addRecord({
                id: nextId,
                name: 'New Monitor',
                host: 'monitor.pulsebadge.local',
                status: 'healthy',
                latencyMs: 0,
                lastChecked: new Date().toISOString()
              });
              if (added) {
                console.log('[insights] Created record:', nextId);
              }
            });
          });
        }
        if (window.__PULSEBADGE_FIXTURES__) {
          bootstrapPage();
        } else {
          fetch('assets/data/pulsebadge-mini.json')
            .then(function (response) {
              if (!response.ok) {
                throw new Error('Network response was not ok');
              }
              return response.json();
            })
            .then(function (fixtures) {
              window.__PULSEBADGE_FIXTURES__ = fixtures;
              bootstrapPage();
            })
            .catch(function () {
              window.__PULSEBADGE_FIXTURES__ = { records: [], preferences: { defaultScreen: 'operations' } };
              bootstrapPage();
            });
        }
      })();
    </script>
    <script src="assets/js/us-003/act_filter_insights.js"></script>
    <script src="assets/js/us-003/act_export_summary.js"></script>
  </body>
</html>
